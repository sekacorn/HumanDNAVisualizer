# Development configuration with H2 in-memory database
server:
  port: 8081

spring:
  application:
    name: dna-integrator

  # H2 in-memory database for development
  datasource:
    url: jdbc:h2:mem:dna_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# JWT Configuration
jwt:
  secret: MySecretKeyForJWT-ChangeThisInProduction-MustBe256BitsOrMore-DevelopmentOnly
  expiration: 86400000  # 24 hours

# File upload settings
upload:
  max-vcf-size: 50MB
  max-fhir-size: 10MB
  max-csv-size: 5MB
  allowed-formats: vcf,json,csv,fasta,pdb,dna

# Security settings
security:
  encryption:
    key: ""  # Auto-generate in dev mode
  max-failed-attempts: 5
  lockout-duration: 30
  allowed-origins: http://localhost:3000,http://localhost:3005

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.dna.integrator: DEBUG
    org.springframework.security: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
