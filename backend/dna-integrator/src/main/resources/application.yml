server:
  port: 8081

spring:
  application:
    name: dna-integrator
  datasource:
    url: jdbc:postgresql://postgres:5432/dna_db
    username: ${DB_USERNAME:dna_user}
    password: ${DB_PASSWORD:dna_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# File upload settings
upload:
  max-vcf-size: 50MB
  max-fhir-size: 10MB
  max-csv-size: 5MB
  allowed-formats: vcf,json,csv,fasta,pdb,dna

# Security settings
security:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

  # File handling security
  file-handling:
    store-raw-uploads: false                # DEFAULT: false - Raw files discarded after import
    raw-file-storage-path: ./secure-uploads # Only used if store-raw-uploads=true
    encrypt-stored-files: true              # Only used if store-raw-uploads=true
    max-storage-days: 30                    # Auto-delete files older than this

  # Network security (no external calls by default)
  network:
    enable-remote-llm: false                # DEFAULT: false - No LLM API calls
    enable-external-apis: false             # DEFAULT: false - No external data fetches

  # Data encryption
  encryption:
    enabled: false                          # Field-level encryption (requires DB_ENCRYPTION_KEY)
    algorithm: AES-256-GCM

  # Privacy settings
  privacy:
    minimal-logging: true                   # Don't log sensitive data
    gdpr-mode: true                         # Enable data deletion features

# Demo Mode Configuration (DISABLED for production)
app:
  demo-mode:
    enabled: false                       # Demo mode MUST be disabled in production
    skip-email-verification: false
    auto-assign-user-role: false
    relaxed-password-policy: false
    expose-demo-credentials: false
    auto-create-demo-users: false
    banner-message: "Production mode - Demo features disabled"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    com.dna.integrator: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
