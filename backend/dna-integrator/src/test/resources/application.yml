server:
  port: 0  # Random port for tests

spring:
  application:
    name: dna-integrator-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  flyway:
    enabled: false  # Disable Flyway for tests

# File upload settings
upload:
  max-vcf-size: 50MB
  max-fhir-size: 10MB
  max-csv-size: 5MB
  allowed-formats: vcf,json,csv,fasta,pdb,dna

# Security settings
security:
  allowed-origins: http://localhost:3000

  # File handling security
  file-handling:
    store-raw-uploads: false
    raw-file-storage-path: ./test-uploads
    encrypt-stored-files: false
    max-storage-days: 30

  # Network security (no external calls by default)
  network:
    enable-remote-llm: false
    enable-external-apis: false

  # Data encryption
  encryption:
    enabled: false
    algorithm: AES-256-GCM

  # Privacy settings
  privacy:
    minimal-logging: true
    gdpr-mode: true

# Demo Mode Configuration (DISABLED for tests)
app:
  demo-mode:
    enabled: false
    skip-email-verification: false
    auto-assign-user-role: false
    relaxed-password-policy: false
    expose-demo-credentials: false
    auto-create-demo-users: false
    banner-message: "Test mode"

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    export:
      prometheus:
        enabled: false

# Logging
logging:
  level:
    com.dna.integrator: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
